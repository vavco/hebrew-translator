<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מתרגם עברית · ערבית · אנגלית</title>
<style>
:root{
  --bg:#f5f6fa;--card:#ffffff;--text:#1c2230;--muted:#667085;--border:#e2e6ef;
  --he:#1d5fd1;--ar:#13804a;--en:#b85a0a;--ok:#0f766e;--accent:#4f46e5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420;--card:#171e2d;--text:#e7eaf2;--muted:#9aa4b8;--border:#2a3448;
    --he:#72aaff;--ar:#5fd39a;--en:#ffab5c;--ok:#5eead4;--accent:#8f8bff;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420;--card:#171e2d;--text:#e7eaf2;--muted:#9aa4b8;--border:#2a3448;
  --he:#72aaff;--ar:#5fd39a;--en:#ffab5c;--ok:#5eead4;--accent:#8f8bff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}
.search button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.search button:disabled{opacity:.6;cursor:default}
.status{color:var(--muted);margin:16px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px;min-width:0}
.badge{display:inline-block;font-size:.85rem;color:var(--ok);font-weight:600;margin-bottom:6px}
.row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}
.lang{flex:0 0 56px;font-weight:700;font-size:.9rem}
.terms{flex:1;min-width:0;font-size:1.3rem;line-height:1.8;overflow-wrap:anywhere}
.c-he .lang,.c-he .terms,.c-he.sentence{color:var(--he)}
.c-ar .lang,.c-ar .terms,.c-ar.sentence{color:var(--ar)}
.c-en .lang,.c-en .terms,.c-en.sentence{color:var(--en)}
.c-ar .terms{font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.terms.missing{color:var(--muted);font-size:1rem;font-style:italic}
.examples-title{font-size:1.1rem;font-weight:700;margin:28px 0 0}
.sentence{font-size:1.2rem;line-height:1.8;margin:8px 0 0;overflow-wrap:anywhere}
.sentence-en{font-size:1rem;margin:8px 0 0;direction:ltr;text-align:left}
mark{background:transparent;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;color:inherit}
.note{color:var(--muted);font-size:.85rem;margin-top:18px}
@media (max-width:480px){
  .row{flex-wrap:wrap;gap:2px}
  .lang{flex:0 0 100%}
  .terms{flex-basis:100%}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>מתרגם: עברית · ערבית · אנגלית</h1>
  <p class="sub">הקלידו מילה בעברית, בערבית או באנגלית. השפה מזוהה אוטומטית, והתרגום מוצג לשתי השפות האחרות. כשאין מילה מקבילה בשפה מסוימת, השורה מסומנת כחסרה.</p>
  <form id="f" class="search" autocomplete="off">
    <input id="q" type="text" placeholder="למשל: ספר, book או كتاب" aria-label="מילה בעברית, בערבית או באנגלית">
    <button id="go" type="submit">תרגם</button>
  </form>
  <div id="out" aria-live="polite"></div>
  <p class="note">מקורות: Wiktionary (תרגומים, ניקוד ודוגמאות שימוש) ו-Wikipedia (גיבוי למשפט לדוגמה). נדרש חיבור לאינטרנט.</p>
</main>
<script>
/* ============ מנוע (פונקציות טהורות, ללא DOM) ============ */

const HE_MARKS = /[֑-ׇ]/g;                       // ניקוד וטעמים
const HAS_NIKUD = /[ְ-ׇֽֿׁׂׅׄ]/;
const HE_LETTERS = /[א-ת]/;
const AR_LETTERS = /[ء-ي]/;
const AR_MARKS = /[ً-ْٰـ]/g;           // תנועות וטטוויל
const FINAL_MAP = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const LANG = {
  he: { name: 'Hebrew',  wiki: 'he', label: 'עברית',  dir: 'rtl' },
  ar: { name: 'Arabic',  wiki: 'ar', label: 'ערבית',  dir: 'rtl' },
  en: { name: 'English', wiki: 'en', label: 'אנגלית', dir: 'ltr' },
};
const unique = a => [...new Set(a)];
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// זיהוי שפת הקלט לפי סוג האותיות
function detectLang(s){
  const t = String(s);
  if (HE_LETTERS.test(t)) return 'he';
  if (AR_LETTERS.test(t)) return 'ar';
  if (/[A-Za-z]/.test(t)) return 'en';
  return null;
}

// כותרת לחיפוש בוויקימילון: עברית בלי ניקוד (מקף הופך לרווח), ערבית בלי תנועות
function heTitle(s){
  return String(s).replace(/[־׀]/g, ' ').replace(HE_MARKS, '').replace(/\s+/g, ' ').trim();
}
function cleanTitle(lang, s){
  const t = String(s).trim();
  if (lang === 'he') return heTitle(t);
  if (lang === 'ar') return t.replace(AR_MARKS, '').replace(/\s+/g, ' ').trim();
  return t.replace(/\s+/g, ' ');
}

// השוואה בין מילים: עברית בלי ניקוד ועם אותיות סופיות מנורמלות
function normHe(s){
  return heTitle(s).replace(/[׳״"'.,!?()\[\]]/g, '')
    .replace(/[ךםןףץ]/g, c => FINAL_MAP[c]).replace(/\s+/g, ' ').trim();
}
// השוואה בין מילים בערבית: בלי תנועות, עם אלף אחידה
function normAr(s){
  return String(s).replace(AR_MARKS, '').replace(/[إأآٱ]/g, 'ا')
    .replace(/[.,!?؟،()"'\[\]]/g, '').replace(/\s+/g, ' ').trim();
}
// השוואה בין מילים באנגלית: אותיות קטנות, בלי פיסוק
function normEn(s){
  return String(s).toLowerCase().replace(/[^a-z' -]/g, '').replace(/\s+/g, ' ').trim();
}
function normFor(lang, s){
  return lang === 'he' ? normHe(s) : lang === 'ar' ? normAr(s) : normEn(s);
}

// ניקוי קוד ויקי: תבניות, קישורים, תגיות HTML, הדגשות
function cleanWiki(s){
  let t = String(s);
  for (let i = 0; i < 3; i++) t = t.replace(/\{\{[^{}]*\}\}/g, '');
  return t.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1')
          .replace(/<[^>]+>/g, '').replace(/''+/g, '')
          .replace(/\s+/g, ' ').trim();
}

// הגדרה באנגלית משורת "# " בסעיף. מחזירה null לערכי הפניה ולשורות בלי טקסט
function glossFromLine(line){
  const body = line.replace(/^#\s*/, '');
  if (/spelling of|alternative (?:form|spelling)|misspelling|inflection of|form of|infinitive of|participle of/i.test(body)) return null;
  const expanded = body.replace(/\{\{(?:tcl|gloss|gl)\|[^|}]*\|([^|}]*)[^}]*\}\}/g, '$1')
                       .replace(/\{\{lb\|[^}]*\}\}/g, '');
  const out = cleanWiki(expanded);
  return /[A-Za-z]/.test(out) ? out : null;
}

// שורות סעיף שפה (==Hebrew== / ==Arabic== / ==English==) בלבד
function sectionLines(wikitext, langName){
  const out = [];
  let inSec = false;
  const head = new RegExp('^==\\s*' + langName + '\\s*==\\s*$');
  for (const line of String(wikitext).split('\n')) {
    if (/^==[^=]/.test(line)) { inSec = head.test(line); continue; }
    if (inSec) out.push(line);
  }
  return out;
}

// ערכים בסעיף שפה: כל תת-כותרת (חלק דיבר / אטימולוגיה) עם צורותיה המנוקדות (wv=) והגדרותיה
function entriesOf(wikitext, langName){
  const entries = [];
  let cur = null;
  for (const line of sectionLines(wikitext, langName)) {
    if (/^={3,}[^=]/.test(line)) { cur = { wv: [], glosses: [] }; entries.push(cur); continue; }
    if (!cur) { cur = { wv: [], glosses: [] }; entries.push(cur); }
    if (/\{\{\s*he-/.test(line)) {
      for (const m of line.matchAll(/\|\s*wv\s*=\s*([^|}\n]+)/g)) cur.wv.push(m[1].trim());
    }
    if (/^# /.test(line)) {
      const g = glossFromLine(line);
      if (g) cur.glosses.push(g);
    }
  }
  return entries;
}
const hebrewEntries = wikitext => entriesOf(wikitext, 'Hebrew');

// מהגדרה באנגלית לשם ערך באנגלית לחיפוש ("to count" -> "count")
function englishHeads(gloss){
  const h = String(gloss).split(/[,;:(]/)[0].trim().toLowerCase()
                 .replace(/^to\s+/, '').replace(/^(?:a|an|the)\s+/, '').trim();
  const out = [h];
  const first = h.split(' ')[0];
  if (first && first !== h) out.push(first);
  return unique(out).filter(x => /^[a-z][a-z' -]{0,40}$/.test(x)).slice(0, 2);
}

// בלוקי תרגום: כל trans-top הוא משמעות אחת באנגלית, ובתוכו תרגומים לעברית ולערבית
const TOP_RE = /\{\{\s*trans-top(?:-see|-also)?\s*(?:\|([^}]*))?\}\}/;
const BOTTOM_RE = /\{\{\s*trans-bottom\s*\}\}/;
const TERM_RE = /\{\{\s*tt?\+?\s*\|\s*(he|ar)\s*\|([^|}]*)/g;
function parseTranslationBlocks(wikitext, head = ''){
  const blocks = [];
  let cur = null;
  for (const line of String(wikitext).split('\n')) {
    const top = line.match(TOP_RE);
    if (top) {
      // head: כותרת העמוד באנגלית שבו נמצא הבלוק, והיא התרגום באנגלית של המשמעות
      cur = { gloss: cleanWiki((top[1] || '').split('|')[0]), head, he: [], ar: [] };
      blocks.push(cur);
      continue;
    }
    if (BOTTOM_RE.test(line)) { cur = null; continue; }
    if (cur) {
      for (const m of line.matchAll(TERM_RE)) {
        const term = cleanWiki(m[2]).replace(/\(.*?\)/g, '').trim();
        if (term) cur[m[1]].push(term);
      }
    }
  }
  return blocks;
}

// צורות מנוקדות לתרגום עברי אחד. קודם הנוסח שבטבלה אם יש בו ניקוד,
// אחר כך צורות wv של ערכים שההגדרה שלהם תואמת למשמעות,
// ולבסוף צורה יחידה בלבד אם היא לא מעורפלת בכל הערך
function vocalizedForms(term, gloss, entries){
  if (HAS_NIKUD.test(term)) return [term.trim()];
  const key = normHe(term);
  const head = englishHeads(gloss)[0];
  const re = head ? new RegExp('\\b' + escRe(head) + '\\b', 'i') : null;
  const near = [];
  if (re) {
    for (const e of entries) {
      if (!e.glosses.some(g => re.test(g))) continue;
      for (const w of e.wv) if (normHe(w) === key) near.push(w);
    }
  }
  if (near.length) return unique(near);
  const all = unique(entries.flatMap(e => e.wv).filter(w => normHe(w) === key));
  return all.length === 1 ? all : [term.trim()];
}

// משמעות משותפת לשלוש השפות. שפת המקור קובעת איזו שורה נבדקת:
// עברית או ערבית: בלוק שמכיל את המילה. אנגלית: כל בלוקי הערך באנגלית.
// מחזירה {gloss, he, ar, en}: ערכי כל שפה לשורה שלה
function findSenses(lang, word, blocks){
  const target = normFor(lang, word);
  const map = new Map();
  for (const b of blocks) {
    // משמעות מתקבלת כשיש לה מילה במילון לפחות באחת משתי השפות, השנייה יכולה להיות חסרה
    if (!b.gloss || (!b.he.length && !b.ar.length)) continue;
    if (lang === 'he' && !b.he.some(t => normHe(t) === target)) continue;
    if (lang === 'ar' && !b.ar.some(t => normAr(t) === target)) continue;
    // האנגלית היא מילת הערך שבעמודו נמצא התרגום (לא הגדרה), כשהמקור עברית או ערבית
    const en = lang === 'en' ? word : (b.head || b.gloss);
    const key = en + '|' + unique(b.ar).join(',');
    if (!map.has(key)) map.set(key, { gloss: b.gloss, he: [], ar: unique(b.ar), en: [en] });
    map.get(key).he.push(...b.he);
  }
  return [...map.values()].map(s => ({
    gloss: s.gloss,
    he: unique(s.he),
    ar: s.ar,
    en: s.en,
  }));
}

// פיצול פרמטרים של תבנית לפי | שלא בתוך {{ }} או [[ ]]
function splitParams(s){
  const out = [];
  let depth = 0, buf = '';
  for (const c of s) {
    if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') depth--;
    if (c === '|' && depth === 0) { out.push(buf); buf = ''; }
    else buf += c;
  }
  out.push(buf);
  return out;
}

// כל קריאות תבנית {{name|...}} בטקסט (namePattern הוא דפוס regex), כמחרוזת פנימית בלי הסוגריים החיצוניים
function templateCalls(text, namePattern){
  const out = [];
  const re = new RegExp('\\{\\{\\s*(?:' + namePattern + ')\\s*\\|', 'g');
  let m;
  while ((m = re.exec(text))) {
    let depth = 0, j = m.index;
    for (; j < text.length; j++) {
      if (text.startsWith('{{', j)) { depth++; j++; }
      else if (text.startsWith('}}', j)) { depth--; j++; if (depth === 0) break; }
    }
    out.push(text.slice(m.index + 2, j - 1));
  }
  return out;
}

// דפוס התאמה לטוקן בשפה נתונה: עם אותיות חיבור/קידומות (עברית, ערבית) או סיומת רבים (אנגלית)
function tokenRe(lang, target){
  const e = escRe(target);
  if (lang === 'he') return new RegExp('^[ובכלמשה]{0,3}' + e + '$');
  if (lang === 'ar') return new RegExp('^[وفبلك]?(?:ال)?' + e + '$');
  return new RegExp('^' + e + '(?:s|es)?$');
}

// סימון המילה בתוך משפט
function markWord(text, tokRe, lang){
  return String(text).split(/(\s+)/).filter(p => p !== '').map(p => ({
    text: p,
    mark: !/^\s+$/.test(p) && tokRe.test(normFor(lang, p)),
  }));
}

// משפטי שימוש מסעיף שפת הערך: תבניות {{ux|lang|...}}, וציטוטים {{RQ:...|text=...}} ו-{{quote-...|lang|text=...}}.
// מחזירה משפט שמכיל את המילה (עדיף התאמה של טוקן שלם), עם תרגום לאנגלית אם הציטוט מלא ויש לו תרגום
function usageExamples(lang, wikitext, word){
  const target = normFor(lang, word);
  if (!target) return null;
  const tokRe = tokenRe(lang, target);
  const sec = sectionLines(wikitext, LANG[lang].name).join('\n');
  const cands = [];
  for (const body of templateCalls(sec, 'ux|RQ:[^|{}\\n]+|quote-[a-z]+')) {
    const parts = splitParams(body);
    const name = parts[0].trim();
    const named = {}, pos = [];
    for (const p of parts.slice(1)) {
      const m = p.match(/^\s*([\w+]+)\s*=([\s\S]*)$/);
      if (m) named[m[1]] = m[2]; else pos.push(p);
    }
    let raw;
    if (name === 'ux') { if ((pos[0] || '').trim() !== lang) continue; raw = pos[1]; }
    else if (name.startsWith('quote-')) { if ((pos[0] || '').trim() !== lang) continue; raw = named.text; }
    else raw = named.text; // RQ:...
    if (!raw) continue;
    const full = cleanWiki(raw);
    const sents = full.split(/(?<=[.!?׃])\s+/).map(s => s.trim()).filter(Boolean);
    const tr = cleanWiki(named.t || named['t+'] || '');
    for (const s of sents) {
      const norm = normFor(lang, s);
      if (!(lang === 'he' ? HE_LETTERS : lang === 'ar' ? AR_LETTERS : /[a-z]/i).test(s) || s.length > 300 || !norm.includes(target)) continue;
      cands.push({
        segs: markWord(s, tokRe, lang),
        en: lang !== 'en' && sents.length === 1 ? tr : '',
        exact: norm.split(' ').some(t => tokRe.test(t)),
      });
    }
  }
  const best = cands.find(c => c.exact) || cands[0];
  return best ? { segs: best.segs, en: best.en } : null;
}

// משפט מתוך קטע חיפוש של ויקיפדיה (מסומן ב-searchmatch)
function extractSentence(snippetHtml){
  const O = '\u0001', C = '\u0002';
  const s = String(snippetHtml)
    .replace(/<span class="searchmatch">/g, O).replace(/<\/span>/g, C)
    .replace(/<[^>]+>/g, '')
    .replace(/&quot;/g, '"').replace(/&#039;|&#39;/g, "'")
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const a = s.indexOf(O), b = s.indexOf(C, a + 1);
  if (a < 0 || b < 0 || b === a + 1) return null;
  const END = /[.!?؟۔\n]/;
  let start = 0;
  for (let i = a - 1; i >= 0; i--) if (END.test(s[i])) { start = i + 1; break; }
  let end = s.length;
  for (let i = b + 1; i < s.length; i++) if (END.test(s[i])) { end = i + 1; break; }
  const sentence = s.slice(start, end).trim();
  if (sentence.length > 280) return null;

  const segs = [];
  let buf = '', inMark = false;
  for (const ch of sentence) {
    if (ch === O || ch === C) {
      if (buf) segs.push({ text: buf, mark: inMark });
      buf = '';
      inMark = ch === O;
    } else buf += ch;
  }
  if (buf) segs.push({ text: buf, mark: inMark });
  return { segs, en: '' };
}

// משפט לדוגמה מוויקיפדיה: רק משפט פרוזה עם מילה מודגשת אחת, לפחות 4 מילים, בלי רשימות
function isProseSentence(ex){
  const text = ex.segs.map(s => s.text).join('');
  const marks = ex.segs.filter(s => s.mark).length;
  return marks === 1 && text.split(/\s+/).length >= 4 && !/\s[–—-]\s/.test(text) && !/[\[\]]/.test(text);
}

/* ============ גישה לרשת ============ */

const sleep = ms => new Promise(r => setTimeout(r, ms));

// קריאה ל-API עם עד שלושה ניסיונות והמתנה הולכת וגדלה (למקרה של הגבלת קצב). זורק שגיאה אם אין תשובה תקינה
async function apiGet(url){
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await sleep(1500 * attempt);
    try {
      const r = await fetch(url);
      const j = r.ok ? await r.json().catch(() => null) : null;
      if (j) return j;
      lastErr = new Error('bad-response');
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

// שליפת דפי ויקי בבקשה אחת לכל עד 50 כותרות. מחזיר Map: כותרת -> טקסט ויקי או null
async function fetchPages(site, titles){
  const out = new Map();
  const list = unique(titles).filter(Boolean);
  for (let i = 0; i < list.length; i += 50) {
    const chunk = list.slice(i, i + 50);
    const url = `https://${site}.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main` +
                `&format=json&formatversion=2&redirects=1&origin=*&titles=${encodeURIComponent(chunk.join('|'))}`;
    const q = (await apiGet(url)).query || {};
    const byTitle = new Map();
    for (const p of q.pages || []) {
      const rev = p.revisions && p.revisions[0];
      byTitle.set(p.title, !p.missing && rev ? rev.slots.main.content : null);
    }
    const alias = new Map();
    for (const n of [...(q.normalized || []), ...(q.redirects || [])]) alias.set(n.from, n.to);
    for (const t of chunk) {
      let final = t;
      for (let k = 0; k < 3 && alias.has(final); k++) final = alias.get(final);
      out.set(t, byTitle.get(final) ?? null);
    }
  }
  return out;
}

// גיבוי למשפט לדוגמה: חיפוש בוויקיפדיה בשפת הערך
async function findWikiExample(lang, term){
  if (!term) return null;
  const url = `https://${LANG[lang].wiki}.wikipedia.org/w/api.php?action=query&list=search&srlimit=8&srprop=snippet&format=json&origin=*&srsearch=${encodeURIComponent(term)}`;
  try {
    const j = await apiGet(url);
    for (const hit of (j.query && j.query.search) || []) {
      const ex = extractSentence(hit.snippet);
      if (ex && isProseSentence(ex)) return ex;
    }
  } catch (e) { /* ללא דוגמה */ }
  return null;
}

// צורות חלופיות לחיפוש לפי כללי הדקדוק של כל שפה. נבדקות רק אם הערך המקורי לא קיים במילון
function variants(lang, t){
  const out = [];
  if (lang === 'he') {
    const p = t.replace(/^[והבלכמש]{1,2}(?=[\u05D0-\u05EA]{2,})/, '');
    out.push(p, t.replace(/(ים|ות)$/, ''), p.replace(/(ים|ות)$/, ''));
  } else if (lang === 'ar') {
    const p = t.replace(/^(?:وال|بال|لل|ال|[وفبلك](?=[\u0621-\u064A]{3}))/, '');
    out.push(p, t.replace(/(ات|ون|ين)$/, ''), p.replace(/(ات|ون|ين)$/, ''));
  } else {
    const l = t.toLowerCase();
    out.push(l.replace(/ies$/, 'y'), l.replace(/es$/, ''), l.replace(/s$/, ''), l.replace(/ed$/, ''), l.replace(/ing$/, ''), l.replace(/ing$/, 'e'));
  }
  return unique(out.map(x => x.trim()).filter(x => x && x !== t && x.length >= 2));
}

// צורות נטויות (רבים, שם פועל וכו') מפנות לצורת היסוד בתבנית מסוג "... of|...|צורת היסוד" בסעיף השפה
function lemmasOf(lang, wikitext){
  const script = lang === 'he' ? HE_LETTERS : lang === 'ar' ? AR_LETTERS : /[a-z]/i;
  const out = [];
  const re = /\{\{\s*[^{}|]*?\bof\s*\|([^{}]*)\}\}/g;
  for (const m of sectionLines(wikitext, LANG[lang].name).join('\n').matchAll(re)) {
    const args = m[1].split('|').filter(a => !/=/.test(a)).map(a => cleanWiki(a).trim());
    const lemma = args.find(a => a && script.test(a) && !/^(to|he|ar|en)$/.test(a));
    // כותרות בוויקימילון הן בלי ניקוד, לכן צורת היסוד מנורמלת לכותרת
    if (lemma) out.push(cleanTitle(lang, lemma));
  }
  return unique(out);
}

// בדיקה של מילה אחת (וצורותיה) במילון: מחזירה {found, lemmas} ואם יש תרגומים גם {lang, senses, ex}
async function lookup(lang, title){
  // באנגלית מנסים גם אות קטנה, כי ערכי ויקימילון באנגלית הם באותיות קטנות
  const names = lang === 'en' ? unique([title, title.toLowerCase()]) : [title];
  const pages = await fetchPages('en.wiktionary', names);
  const usedTitle = names.find(n => pages.get(n));
  const text = usedTitle ? pages.get(usedTitle) : null;
  if (!text) return { found: false, lemmas: [] };

  const entries = entriesOf(text, LANG[lang].name);
  const lemmas = lemmasOf(lang, text);
  let blocks = [];
  if (lang === 'en') {
    // באנגלית, תרגומי הערך נמצאים בעמוד עצמו ובתת-הדף /translations
    const tp = await fetchPages('en.wiktionary', [usedTitle + '/translations']);
    blocks = [...parseTranslationBlocks(text, usedTitle), ...parseTranslationBlocks(tp.get(usedTitle + '/translations') || '', usedTitle)];
  } else {
    const glosses = entries.flatMap(e => e.glosses);
    // שאילתה אחת לכל הערכים באנגלית: הערך עצמו ותת-דף התרגומים שלו
    const heads = unique(glosses.flatMap(englishHeads)).slice(0, 8);
    if (heads.length) {
      const hp = await fetchPages('en.wiktionary', heads.flatMap(h => [h, h + '/translations']));
      for (const [k, t] of hp) if (t) blocks.push(...parseTranslationBlocks(t, k.replace(/\/translations$/, '')));
    }
  }

  let senses = findSenses(lang, usedTitle, blocks);
  if (!senses.length && lang !== 'en') {
    // אין טבלת תרגום לערך: מציגים את מילות ההגדרה הקצרות באנגלית, והשפה השנייה נשארת חסרה
    const heads = unique(entries.flatMap(e => e.glosses).flatMap(englishHeads)).slice(0, 4);
    if (heads.length) {
      senses = [{
        gloss: heads[0],
        he: lang === 'he' ? vocalizedForms(usedTitle, heads[0], entries) : [],
        ar: lang === 'ar' ? [usedTitle] : [],
        en: heads,
      }];
    }
  }
  if (!senses.length) return { found: true, lemmas };

  // ניקוד לעברית: עברית שמגיעה מתרגום בלי ניקוד מקבלת את הצורות מעמוד המילה העברית שלה
  let heEntries = lang === 'he' ? entries : [];
  const hePages = new Map();
  if (lang !== 'he') {
    const heTitles = unique(senses.flatMap(s => s.he).map(heTitle)).filter(Boolean);
    const hep = await fetchPages('en.wiktionary', heTitles);
    for (const [k, t] of hep) if (t) { hePages.set(k, t); heEntries.push(...hebrewEntries(t)); }
  }
  for (const s of senses) {
    s.he = unique(s.he.flatMap(t => vocalizedForms(t, s.gloss, heEntries)));
  }

  // משפט לדוגמה תמיד בעברית: משפט השימוש של המילה העברית (אם המקור עברית, של המילה שהוקלדה)
  let exWord = usedTitle, exText = text;
  if (lang !== 'he') {
    const first = senses.map(s => s.he[0]).find(Boolean);
    exWord = first ? heTitle(first) : '';
    exText = hePages.get(exWord) || null;
  }
  const ex = !exWord ? null
    : (exText && usageExamples('he', exText, exWord)) || await findWikiExample('he', exWord);
  return { found: true, lemmas, lang, senses, ex };
}

// הפונקציה הראשית: מחזירה {error} או {lang, senses, ex, via}.
// מנסה את המילה כפי שהוקלדה, ואחר כך צורות חלופיות וצורת היסוד (עד 6 בדיקות)
async function translate(word){
  const lang = detectLang(word);
  if (!lang) return { error: 'unsupported' };
  const title = cleanTitle(lang, word);
  if (!title) return { error: 'empty' };

  // בקשה אחת לכל הכותרות האפשריות (המילה וצורותיה החלופיות), כדי לחסוך בקשות לוויקימילון
  const cands = unique([title, ...variants(lang, title)]);
  const exists = await fetchPages('en.wiktionary', cands);
  const queue = cands.filter(c => exists.get(c));
  if (!queue.length) return { error: 'no-entry' };

  const seen = new Set();
  for (let i = 0; i < queue.length && seen.size < 6; i++) {
    const t = queue[i];
    if (seen.has(t)) continue;
    seen.add(t);
    if (i > 0) await sleep(800);
    const r = await lookup(lang, t);
    if (r.senses && r.senses.length) {
      return { lang: r.lang, senses: r.senses, ex: r.ex, via: t !== title ? t : '' };
    }
    // צורת היסוד שהערך מפנה אליה מצטרפת לתור החיפוש
    for (const x of r.lemmas || []) if (!seen.has(x) && !queue.includes(x)) queue.push(x);
  }
  return { lang, senses: [] };
}

/* ============ ממשק (DOM) ============ */

if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const row = (lang, text) => {
    const r = el('div', 'row c-' + lang);
    r.append(el('span', 'lang', LANG[lang].label));
    const t = el('span', 'terms', text || 'אין מילה מקבילה במילון');
    if (!text) t.classList.add('missing');
    t.dir = LANG[lang].dir;
    r.append(t);
    return r;
  };

  // משפט לדוגמה תמיד בעברית, בלי תרגום
  function sentenceBox(ex){
    const box = el('section', 'card');
    if (!ex) {
      box.append(el('p', 'status', 'לא נמצא משפט לדוגמה בעברית, לא במילון ולא בוויקיפדיה.'));
      return box;
    }
    const p = el('p', 'sentence c-he');
    p.dir = 'rtl';
    for (const seg of ex.segs) p.append(seg.mark ? el('mark', null, seg.text) : seg.text);
    box.append(p);
    return box;
  }

  function render(res){
    const out = $('out');
    out.replaceChildren();
    if (res.error === 'unsupported') {
      out.append(el('p', 'status', 'לא זוהתה שפה. הקלידו מילה בעברית, בערבית או באנגלית.'));
      return;
    }
    if (res.error === 'no-entry' || res.error === 'empty') {
      out.append(el('p', 'status', 'לא נמצא ערך למילה זו במילון. נסו צורת יסוד של המילה, בלי מילות יחס או סיומות.'));
      return;
    }
    if (!res.senses.length) {
      out.append(el('p', 'status', 'לא נמצא תרגום למילה זו במילונים.'));
      return;
    }
    if (res.via) out.append(el('p', 'note', 'המילה נמצאה במילון לפי הצורה: ' + res.via));
    for (const s of res.senses) {
      const card = el('section', 'card');
      const full = ['he', 'ar', 'en'].every(l => s[l].length);
      card.append(el('div', 'badge', full ? '✔ משמעות משותפת לשלוש השפות' : 'משמעות שנמצאה, חלק מהתרגומים חסרים'));
      for (const lang of ['he', 'ar', 'en']) card.append(row(lang, s[lang].join(' · ')));
      out.append(card);
    }
    out.append(el('h2', 'examples-title', 'משפט לדוגמה בעברית'));
    out.append(sentenceBox(res.ex));
  }

  let reqId = 0;
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const word = $('q').value.trim();
    if (!word) return;
    const id = ++reqId;
    const btn = $('go');
    btn.disabled = true;
    $('out').replaceChildren(el('p', 'status', 'מחפש במילונים…'));
    let res;
    try { res = await translate(word); }
    catch (err) { res = { error: 'network', detail: String(err && err.message || err) }; }
    if (id !== reqId) return;
    btn.disabled = false;
    if (res.error === 'network') {
      $('out').replaceChildren(
        el('p', 'status', 'לא התקבלה תשובה מהמילונים. ייתכן עומס זמני על השירות או חסימה ברשת. נסו שוב בעוד דקה או שתיים.'),
        el('p', 'note', 'פרט טכני: ' + (res.detail || 'לא ידוע') + ' | דף: ' + location.protocol));
      return;
    }
    render(res);
  });
}
</script>
